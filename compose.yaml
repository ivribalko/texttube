name: texttube

services:
  vpn:
    profiles:
      - vpn
    image: "${VPN_GATEWAY_IMAGE:-vpn-gateway:disabled}"
    pull_policy: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
      HTTPPROXY_STEALTH: "on"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: >-
        {"auth":"apikey","apikey":"${VPN_CONTROL_API_KEY:-}"}
      SERVER_COUNTRIES: "${VPN_SERVER_COUNTRIES:-}"
      TZ: "${TZ:-UTC}"
      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-}"
      VPN_TYPE: "${VPN_PROTOCOL:-wireguard}"
      WIREGUARD_PRIVATE_KEY: "${VPN_PRIVATE_KEY:-}"
    restart: unless-stopped
    stop_grace_period: 30s

  texttube:
    image: ghcr.io/ivribalko/texttube:latest
    pull_policy: always
    command: serve
    environment:
      CRON: "${CRON:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID is required}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET is required}"
      TRANSCRIPT_PROXY_CONTROL_API_KEY: "${VPN_CONTROL_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}"
      TEXTTUBE_HOME: /data
      TEXTTUBE_LIMIT: "${TEXTTUBE_LIMIT:-}"
      TEXTTUBE_VERBOSE: "${TEXTTUBE_VERBOSE:-}"
      TRANSCRIPT_LANGUAGES: "${TRANSCRIPT_LANGUAGES:-}"
      TZ: "${TZ:-UTC}"
    healthcheck:
      test: [CMD, python, -m, texttube.entrypoints.auth, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30m
    volumes:
      - texttube-data:/data/var
    depends_on:
      vpn:
        condition: service_healthy
        required: false
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  texttube-data:
